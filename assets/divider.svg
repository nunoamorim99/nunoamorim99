<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="divider">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#12B9A6" stop-opacity="0"/>
    <stop offset=".5" stop-color="#12B9A6"/>
    <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
.beam { animation: sweep 5s cubic-bezier(.6,0,.4,1) infinite; }
@keyframes sweep { from { transform: translateX(-320px); } to { transform: translateX(1200px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .role { opacity: 0; } .role-0 { opacity: 1; } .role-0 .clip { transform: none; } .px { opacity: 0; } .photo { opacity: 1; } }
</style>
<rect x="0" y="11.5" width="1200" height="1" fill="#8B949E" opacity=".25"/>
<rect class="beam" x="0" y="11" width="320" height="2" rx="1" fill="url(#g)"/>
</svg>
